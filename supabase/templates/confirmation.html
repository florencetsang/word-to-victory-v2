<div style="font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; color: #1d1f3d">
  <h2 style="font-family: Georgia, serif; color: #2e3270">Sign in to Word to Victory</h2>
  <p>Click the button below to sign in. Open it in the same browser where you requested it.</p>
  <p>
    <a
      href="{{ .ConfirmationURL }}"
      style="
        display: inline-block;
        background: #2e3270;
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
      "
      >Sign in</a
    >
  </p>
  <p>Or enter this code in the app:</p>
  <p style="font-size: 28px; font-weight: bold; letter-spacing: 6px; font-family: monospace">{{ .Token }}</p>
  <p style="color: #6b6d85; font-size: 13px">
    This link and code expire in 1 hour and can only be used once. If you didn't request this, you can ignore this
    email.
  </p>
</div>
